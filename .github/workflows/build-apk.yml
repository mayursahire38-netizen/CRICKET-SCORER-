name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          npx cap init "MSA Cricket Scorer" "com.msa.cricketscorer" --web-dir www
          npx cap add android
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#121212'
          fi
          npx cap sync android
          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let g = fs.readFileSync(p, "utf8");
            g += `\nconfigurations.all {\n  resolutionStrategy {\n    force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"\n    force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"\n    force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"\n  }\n}\n`;
            fs.writeFileSync(p, g);
          '

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: msa-cricket-scorer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
